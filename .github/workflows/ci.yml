name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. 静态代码分析与格式化检查
  analyze:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format .

      - name: Run Static Analysis
        run: flutter analyze

      # 版本号防呆：pubspec.yaml 与 version_manifest.json 必须一致，
      # 否则客户端会误判"有新版本"，装完又被系统当成降级拒绝安装
      - name: Verify Version Manifest Consistency
        run: dart run tool/sync_version_manifest.dart

  # 2. 排版引擎与核心逻辑测试（切半行算法、锚点保留、避头避尾）
  test:
    name: Unit & Engine Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Layout Engine & Unit Tests
        run: flutter test --coverage

  # 3. 多端构建冒烟验证 (Android & Web)
  build-check:
    name: Multi-Platform Build Verification
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        target: [apk, web]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (for Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        if: matrix.target == 'apk'
        run: flutter build apk --debug

      - name: Build Web Release Bundle
        if: matrix.target == 'web'
        run: flutter build web --release

  # 4. 重型原生插件黑名单检查
  #
  # 这一步原先叫「纯血鸿蒙 (OpenHarmony NEXT) 依赖准入审查」，
  # 但它做的事只是 grep 三个库名，与鸿蒙兼容性没有任何关系——
  # 本项目也从未产出过可运行的鸿蒙包。按实际行为更名，不再冒充平台认证。
  native-plugin-guard:
    name: Heavy Native Plugin Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Heavy Native Plugins
        run: |
          echo "=== 检查是否引入重型原生插件 ==="
          # 这三个库各自拖进一整套原生实现（WebView 内核、广告 SDK），
          # 会把包体撑大、拉高平台耦合，也会堵死将来移植到其它平台的路。
          # 注意：这里查的只是这份黑名单，**不能**据此声称支持任何平台。
          if grep -E "(flutter_inappwebview|webview_flutter|google_mobile_ads)" pubspec.yaml; then
            echo "::error::引入了重型原生插件，请确认必要性后再放行。"
            exit 1
          fi
          echo "✓ 未引入黑名单中的重型原生插件"
