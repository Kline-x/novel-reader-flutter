name: Release & Distribution Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 1. 质量与鸿蒙准入门禁检查
  quality-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Full Automated Test Suite
        run: flutter test

      - name: OpenHarmony NEXT Dependency Audit
        run: |
          echo "=== 正在执行 OpenHarmony NEXT / Pure Dart 生态准入终审 ==="
          if grep -E "(flutter_inappwebview|webview_flutter|google_mobile_ads)" pubspec.yaml; then
            echo "❌ 阻断：发现未经 OpenHarmony-TPC 认证的非兼容原生插件！"
            exit 1
          fi
          echo "✅ 准入门禁通过：所有依赖 100% 具备纯血鸿蒙支持能力！"

  # 2. 生产构建与极客瘦身分包
  build-release:
    name: Build & Package Production Artifacts
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APKs (Split per ABI & R8 Shrink)
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p release-artifacts/apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/apk/novel-reader-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/apk/novel-reader-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/apk/novel-reader-x86_64.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-artifacts/apk/*.apk

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release
          mkdir -p release-artifacts/aab
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/aab/novel-reader-release.aab

      - name: Build Web Release Bundle
        run: |
          flutter build web --release
          cd build/web
          zip -r ../../release-artifacts/novel-reader-web.zip .
          cd ../..

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      # 把三个 ABI 包的真实下载地址、sha256 与体积回填进 version_manifest.json。
      # 不回填的话：客户端的完整性校验会拦下自家的包，
      # 且 armeabi-v7a 设备会下到 arm64 包而 INSTALL_FAILED_NO_MATCHING_ABIS。
      - name: Fill Version Manifest (URLs / sha256 / fileSize)
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          dart run tool/sync_version_manifest.dart --write --tag "$TAG"             --apk arm64-v8a=release-artifacts/apk/novel-reader-arm64-v8a.apk             --apk armeabi-v7a=release-artifacts/apk/novel-reader-armeabi-v7a.apk             --apk x86_64=release-artifacts/apk/novel-reader-x86_64.apk
          cat version_manifest.json
          cp version_manifest.json /tmp/version_manifest.filled.json

      # 发布说明直接取 version_manifest.json 里的 releaseNotes，
      # 与用户在 App 内「发现新版本」弹窗看到的文案是同一份，避免两处各写一套。
      - name: Compose Release Body
        run: |
          {
            echo "## 藏书阁 (Novel Reader) $(jq -r .versionName version_manifest.json)"
            echo
            jq -r .releaseNotes version_manifest.json
            echo
            echo "安装包按 ABI 分发，arm64-v8a 适用于绝大多数机型；"
            echo "各包的 sha256 见 SHA256SUMS.txt，App 内更新时会自动校验。"
          } > /tmp/RELEASE_BODY.md
          cat /tmp/RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "藏书阁 (Novel Reader) ${{ github.event.inputs.version_tag || github.ref_name }}"
          prerelease: ${{ github.event.inputs.prerelease || false }}
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/apk/*.apk
            release-artifacts/aab/*.aab
            release-artifacts/novel-reader-web.zip
            release-artifacts/SHA256SUMS.txt
            version_manifest.json
          body_path: /tmp/RELEASE_BODY.md

      # 客户端就是从 main 拉这份清单的，所以放在 Release 建好之后再提交 ——
      # 否则清单先指向还不存在的 Release，用户会下到 404。
      # 流水线跑的是 tag（detached HEAD），期间 main 可能已落新提交，
      # 直接 push 会被 non-fast-forward 拒掉（v1.0.6 首发就栽在这），
      # 因此每次都基于最新的 origin/main 重新落这份清单并重试。
      - name: Commit Manifest Back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -f -B release-manifest FETCH_HEAD
            cp /tmp/version_manifest.filled.json version_manifest.json
            git add version_manifest.json
            if git diff --cached --quiet; then
              echo "清单与 main 上已一致，跳过提交"
              exit 0
            fi
            git commit -m "chore(release): 回填 ${{ github.event.inputs.version_tag || github.ref_name }} 的下载地址与 sha256 校验和"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "推送被拒（main 期间有新提交），重试 $i/3"
            sleep 5
          done
          echo "::error::清单回填提交推送 main 失败，请手动同步 version_manifest.json"
          exit 1
