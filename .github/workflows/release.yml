name: Release & Distribution Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 1. 质量与鸿蒙准入门禁检查
  quality-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis
        run: flutter analyze

      - name: Full Automated Test Suite
        run: flutter test

      - name: OpenHarmony NEXT Dependency Audit
        run: |
          echo "=== 正在执行 OpenHarmony NEXT / Pure Dart 生态准入终审 ==="
          if grep -E "(flutter_inappwebview|webview_flutter|google_mobile_ads)" pubspec.yaml; then
            echo "❌ 阻断：发现未经 OpenHarmony-TPC 认证的非兼容原生插件！"
            exit 1
          fi
          echo "✅ 准入门禁通过：所有依赖 100% 具备纯血鸿蒙支持能力！"

  # 2. 生产构建与极客瘦身分包
  build-release:
    name: Build & Package Production Artifacts
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APKs (Split per ABI & R8 Shrink)
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p release-artifacts/apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-artifacts/apk/novel-reader-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-artifacts/apk/novel-reader-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-artifacts/apk/novel-reader-x86_64.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-artifacts/apk/*.apk

      - name: Build Android App Bundle (AAB)
        run: |
          flutter build appbundle --release
          mkdir -p release-artifacts/aab
          cp build/app/outputs/bundle/release/app-release.aab release-artifacts/aab/novel-reader-release.aab

      - name: Build Web Release Bundle
        run: |
          flutter build web --release
          cd build/web
          zip -r ../../release-artifacts/novel-reader-web.zip .
          cd ../..

      - name: Generate SHA256 Checksums
        run: |
          cd release-artifacts
          find . -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.zip" \) -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      # 把三个 ABI 包的真实下载地址、sha256 与体积回填进 version_manifest.json，
      # 并提交回 main —— 客户端就是从 main 拉这份清单的。
      # 不回填的话：客户端的完整性校验会拦下自家的包，
      # 且 armeabi-v7a 设备会下到 arm64 包而 INSTALL_FAILED_NO_MATCHING_ABIS。
      - name: Fill Version Manifest (URLs / sha256 / fileSize)
        run: |
          TAG="${{ github.event.inputs.version_tag || github.ref_name }}"
          dart run tool/sync_version_manifest.dart --write --tag "$TAG" \
            --apk arm64-v8a=release-artifacts/apk/novel-reader-arm64-v8a.apk \
            --apk armeabi-v7a=release-artifacts/apk/novel-reader-armeabi-v7a.apk \
            --apk x86_64=release-artifacts/apk/novel-reader-x86_64.apk
          cat version_manifest.json

      - name: Commit Manifest Back to main
        run: |
          if git diff --quiet version_manifest.json; then
            echo "清单无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version_manifest.json
          git commit -m "chore(release): 回填 ${{ github.event.inputs.version_tag || github.ref_name }} 的下载地址与 sha256 校验和"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: "藏书阁 (Novel Reader) ${{ github.event.inputs.version_tag || github.ref_name }}"
          prerelease: ${{ github.event.inputs.prerelease || false }}
          draft: false
          generate_release_notes: true
          files: |
            release-artifacts/apk/*.apk
            release-artifacts/aab/*.aab
            release-artifacts/novel-reader-web.zip
            release-artifacts/SHA256SUMS.txt
            version_manifest.json
          body: |
            ## 藏书阁 (Novel Reader) 生产正式发版

            ### 💎 核心亮点
            - **全量 14 阶段完整落地**：从排版引擎到全网换源、离线并发、大文件分章、自然语音听书、WebDAV 云漫游到纯血鸿蒙 NEXT 对等支持；
            - **出版级 CJK 排版引擎**：整数行截断、字符锚点追踪、四种翻页动效，彻底告别半行切割；
            - **Modern Soft UI 视觉设计**：连续曲率 Squircle、双层微阴影与 62px 悬浮毛玻璃胶囊 Dock；
            - **极客瘦身架构**：R8 代码混淆优化 + 资源修剪，单架构 APK 体积仅 ~22MB（较 Debug 瘦身 85%+）；
            - **全平台多端对等**：Android、iOS、OpenHarmony NEXT (纯血鸿蒙)、Web (WASM)。
