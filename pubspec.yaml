name: novel_reader_flutter
description: "A professional novel reader with Modern Soft UI and deterministic CJK typography engine."
publish_to: "none"
version: 1.0.1+2002

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  html: ^0.15.4
  xpath_selector: ^3.0.2
  json_path: ^0.7.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  lpinyin: ^2.0.3
  fast_gbk: ^1.0.0
  path_provider: ^2.1.2
  archive: ^4.3.0
  flutter_tts: ^4.2.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
