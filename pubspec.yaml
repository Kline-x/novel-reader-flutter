name: novel_reader_flutter
description: "A professional novel reader with Modern Soft UI and deterministic CJK typography engine."
publish_to: "none"
version: 1.0.10+4008

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  html: ^0.15.4
  xpath_selector: ^3.0.2
  json_path: ^0.7.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  lpinyin: ^2.0.3
  fast_gbk: ^1.0.0
  path_provider: ^2.1.2
  archive: ^4.3.0
  flutter_tts: ^4.2.5
  crypto: ^3.0.7

  # 鸿蒙平台实现。pub 上的官方包没有 ohos 实现，缺了它们 MethodChannel
  # 会既不返回也不抛异常地永久挂起（try/catch 接不住），表现为界面永远转圈。
  # 这三个包只在 ohos 构建时被注册，不影响 Android / iOS / Web。
  path_provider_ohos: ^2.2.1
  shared_preferences_ohos: ^2.2.0
  flutter_tts_ohos: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
